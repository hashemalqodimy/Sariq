name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Environment and Keystore
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore 2>/dev/null || true
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: "debug.keystore"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD }}"
        run: gradle assembleRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare APK File
        run: |
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/aman-phone.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aman-phone-release.apk
          path: app/build/outputs/apk/release/aman-phone.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Aman Phone - أمان فون v1.0"
          body: |
            ### 📱 تطبيق أمان فون (Aman Phone) - النسخة الجاهزة للتثبيت
            قم بتنزيل ملف **`aman-phone.apk`** المرفق بالأسفل وتثبيته مباشرة على هاتفك.
          files: app/build/outputs/apk/release/aman-phone.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
