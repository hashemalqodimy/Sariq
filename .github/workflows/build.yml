name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Pins the Gradle version to the one declared in gradle/wrapper/gradle-wrapper.properties
      # (AGP 9.x requires Gradle 9.x; the runner's preinstalled Gradle is not guaranteed to match).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare Environment
        run: touch .env
        # debug.keystore is generated automatically by app/build.gradle.kts when missing.

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk aman-phone.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aman-phone-debug-apk
          path: aman-phone.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Release APK on GitHub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Aman Phone - أمان فون v1.0"
          body: |
            ### 📱 تطبيق أمان فون (Aman Phone) - النسخة الجاهزة للتثبيت
            قم بتنزيل ملف **`aman-phone.apk`** المرفق بالأسفل وتثبيته مباشرة على هاتفك.
          files: aman-phone.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
